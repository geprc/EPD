<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f1e8">
    <title>EPD 电子墨水屏画板</title>
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>
    <main class="panel">
        <header>
            <p class="eyebrow">ESP32 · GDEP015OC1</p>
            <h1>电子墨水屏画板</h1>
            <p class="description">在画布上书写，然后将 200 × 200 黑白图像发送到墨水屏。</p>
        </header>

        <canvas id="canvas" width="200" height="200"
                aria-label="黑白绘图画布"></canvas>

        <div class="toolbar">
            <button id="clear" type="button" class="secondary">清空</button>
            <button id="send" type="button">发送到屏幕</button>
        </div>

        <p id="status" class="status" role="status" aria-live="polite">
            正在连接设备…
        </p>
    </main>
    <script src="/js/draw.js"></script>
</body>
</html>
